<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="Invoice Reconciler blueprint poster">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123a72" />
      <stop offset="0.55" stop-color="#0c2a55" />
      <stop offset="1" stop-color="#071b39" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8fc4ff" stroke-opacity="0.14" stroke-width="1" />
    </pattern>
    <pattern id="fine" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0H0V8" fill="none" stroke="#8fc4ff" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="960" height="540" fill="url(#plate)" />
  <rect width="960" height="540" fill="url(#fine)" />
  <rect width="960" height="540" fill="url(#grid)" />

  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, sans-serif" font-weight="700" fill="#f8fbff">
    <text x="80" y="180" font-size="72" letter-spacing="-2">Invoice</text>
    <text x="80" y="254" font-size="72" letter-spacing="-2">Reconciler</text>
  </g>

  <g fill="#bfdbfe" fill-opacity="0.7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="3">
    <text x="82" y="300">LEDGER / MONTHLY CLOSE</text>
  </g>

  <g fill="none" stroke="#dbeafe" stroke-opacity="0.75" stroke-width="2">
    <rect x="80" y="360" width="220" height="120" rx="12" />
    <path d="M80 400h220M80 440h220" stroke-opacity="0.35" />
    <path d="M360 372h120M360 412h80M360 452h120" stroke-opacity="0.45" />
  </g>

  <g fill="#dbeafe" fill-opacity="0.85">
    <rect x="100" y="378" width="80" height="8" rx="4" />
    <rect x="100" y="418" width="140" height="8" rx="4" />
    <rect x="100" y="458" width="60" height="8" rx="4" />
  </g>

  <g fill="none" stroke="#dbeafe" stroke-opacity="0.75" stroke-width="2">
    <rect x="600" y="96" width="280" height="348" rx="14" />
    <path d="M600 156h280M600 216h280M600 276h280M600 336h280M600 396h280" stroke-opacity="0.3" />
  </g>

  <g fill="#dbeafe" fill-opacity="0.8">
    <rect x="628" y="120" width="96" height="9" rx="4.5" />
    <rect x="628" y="180" width="150" height="9" rx="4.5" />
    <rect x="628" y="240" width="118" height="9" rx="4.5" />
    <rect x="628" y="300" width="170" height="9" rx="4.5" />
    <rect x="628" y="360" width="72" height="9" rx="4.5" />
  </g>

  <g fill="none" stroke="#f8fbff" stroke-opacity="0.85" stroke-width="3">
    <path d="M760 372l22 22 46-50" />
  </g>

  <g fill="none" stroke="#f8fbff" stroke-opacity="0.4" stroke-width="2">
    <path d="M600 480h72v40h-72zM692 480h72v40h-72zM784 480h72v40h-72z" />
  </g>

  <g fill="#dbeafe" fill-opacity="0.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2">
    <text x="600" y="540">matching / aliases / report</text>
